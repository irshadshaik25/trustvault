
spring.application.name=trustvault

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustvault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

# Private storage location for uploaded documents
trustvault.storage.location=${user.home}/trustvault-private-storage

# Maximum upload sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Supabase private document storage
trustvault.storage.provider=${STORAGE_PROVIDER:local}
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.bucket=${SUPABASE_BUCKET:trustvault-documents}
